<svg width="600" height="450" viewBox="0 0 600 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED" />
      <stop offset="50%" stop-color="#FFEDD5" />
      <stop offset="100%" stop-color="#FED7AA" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="templeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="50%" stop-color="#C2410C" />
      <stop offset="100%" stop-color="#9A3412" />
    </linearGradient>
    <linearGradient id="goldRoof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <!-- Sky Canvas -->
  <rect width="600" height="450" fill="url(#heroSky)" />

  <!-- Radiant Golden Sun -->
  <circle cx="300" cy="140" r="130" fill="url(#sunGlow)" />
  <circle cx="300" cy="140" r="45" fill="#FEF08A" />

  <!-- Sacred Geometry Mandala Aura -->
  <g opacity="0.12" stroke="#C2410C" stroke-width="1.5">
    <circle cx="300" cy="140" r="160" />
    <circle cx="300" cy="140" r="110" stroke-dasharray="4 4" />
    <polygon points="300,10 330,100 420,100 350,150 380,240 300,190 220,240 250,150 180,100 270,100" />
  </g>

  <!-- Traditional Sacred Temple Silhouette -->
  <!-- Base Ground -->
  <path d="M0 450 L0 390 Q300 370 600 390 L600 450 Z" fill="#78350F" opacity="0.9" />
  <path d="M0 450 L0 410 Q300 395 600 410 L600 450 Z" fill="#15803D" opacity="0.8" />

  <!-- Temple Plinth / Steps -->
  <rect x="150" y="340" width="300" height="25" rx="3" fill="#D97706" />
  <rect x="175" y="320" width="250" height="22" rx="3" fill="#B45309" />
  <rect x="200" y="300" width="200" height="22" rx="3" fill="#9A3412" />

  <!-- Mandir Pillars -->
  <rect x="215" y="220" width="16" height="82" rx="2" fill="url(#templeGrad)" />
  <rect x="260" y="220" width="16" height="82" rx="2" fill="url(#templeGrad)" />
  <rect x="324" y="220" width="16" height="82" rx="2" fill="url(#templeGrad)" />
  <rect x="369" y="220" width="16" height="82" rx="2" fill="url(#templeGrad)" />

  <!-- Inner Sanctum Glow -->
  <rect x="276" y="235" width="48" height="67" rx="24" fill="#FEF08A" opacity="0.8" />
  <!-- Sacred Diya inside sanctum -->
  <path d="M290 280 Q300 290 310 280 Q300 285 290 280 Z" fill="#C2410C" />
  <circle cx="300" cy="274" r="4" fill="#EA580C" />
  <path d="M300 264 C303 270 305 273 300 278 C295 273 297 270 300 264 Z" fill="#FEF08A" />

  <!-- Shikhara / Dome -->
  <path d="M200 220 L300 90 L400 220 Z" fill="url(#goldRoof)" stroke="#9A3412" stroke-width="2" />
  <!-- Kalash & Dhwaja (Sacred Flag) -->
  <circle cx="300" cy="85" r="7" fill="#FBBF24" stroke="#9A3412" stroke-width="1.5" />
  <path d="M300 78 L300 48" stroke="#D97706" stroke-width="2.5" stroke-linecap="round" />
  <path d="M300 50 L345 62 L300 74 Z" fill="#EA580C" />

  <!-- Side Shrines / Chhatris -->
  <path d="M120 340 L160 250 L200 340 Z" fill="url(#templeGrad)" opacity="0.85" />
  <path d="M400 340 L440 250 L480 340 Z" fill="url(#templeGrad)" opacity="0.85" />

  <!-- Sacred Banyan Tree Silhouettes on Left & Right -->
  <path d="M30 450 Q70 320 120 280 Q100 240 60 250 Q20 220 0 250 L0 450 Z" fill="#166534" opacity="0.5" />
  <path d="M570 450 Q530 320 480 280 Q500 240 540 250 Q580 220 600 250 L600 450 Z" fill="#166534" opacity="0.5" />

  <!-- Overlay Dark Vignette at bottom -->
  <rect y="375" width="600" height="75" fill="#000000" opacity="0.4" />
  <text x="300" y="410" font-family="'Noto Sans Devanagari', 'Tiro Devanagari Hindi', sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    कमला देवी पब्लिक सेवा मन्दिर ट्रस्ट
  </text>
  <text x="300" y="432" font-family="sans-serif" font-size="12" fill="#FDE68A" text-anchor="middle">
    तपोभूमि ग्राम शुक्रताल, जानसठ (मुजफ्फरनगर, उ.प्र.) • स्थापित 1882 ट्रस्ट विलेख
  </text>
</svg>